name: Android build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-ai-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - name: Download Gradle with retries
        run: |
          for attempt in 1 2 3; do
            ./gradlew --version && exit 0
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done
      - run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: my-ai-agent-debug
          path: my-ai-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
